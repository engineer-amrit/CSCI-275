version: '3.8'

# Docker Compose configuration for local development
# This file orchestrates all microservices for the Restaurant Review Platform

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-postgres
    environment:
      POSTGRES_DB: alpha_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for caching/sessions)
  redis:
    image: redis:7-alpine
    container_name: restaurant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Moderation API (our service)
  moderation-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: moderation-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/alpha_db
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../src:/app/src

  # User Authentication Service
  user-auth:
    build:
      context: ./user-auth
      dockerfile: Dockerfile
    container_name: user-auth-service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/alpha_db
      SESSION_SECRET: your-session-secret-here
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./user-auth:/app
      - /app/node_modules

  # Restaurant Management Service
  restaurant:
    build:
      context: ./restaurant
      dockerfile: Dockerfile
    container_name: restaurant-service
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/alpha_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./restaurant/src:/app/src

  # Search Service
  search:
    build:
      context: ./search
      dockerfile: Dockerfile
    container_name: search-service
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/alpha_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./search:/app

volumes:
  postgres_data:
  redis_data:
